spring.application.name=helpdesk-platform

# Postgres connection
spring.datasource.url=jdbc:postgresql://localhost:5433/helpdesk
spring.datasource.username=helpdesk_user
spring.datasource.password=helpdesk_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

app.jwt.secret=CXM1b7fgkRMo060ZQKgHv3WN+3t1zE+/M2sfaB6Ngvc
app.jwt.expiration-ms=86400000

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=helpdesk-logger
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Logging
logging.level.org.apache.kafka=WARN
logging.file.name=logs/app.log

spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
app.sla.response-seconds.low=20
app.sla.response-seconds.medium=14400
app.sla.response-seconds.high=3600
app.sla.response-seconds.urgent=900


